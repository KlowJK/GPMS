<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256"
     width="32" height="32"
     preserveAspectRatio="xMidYMid meet"
     role="img" aria-labelledby="title">
  <title id="title">GPMS Favicon</title>
  <defs>
    <linearGradient id="grad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="256" height="256" rx="40" ry="40" fill="url(#grad)"/>

  <!-- Simple geometric 'G' mark built from shapes (no fonts) -->
  <!-- Outer white disk -->
  <circle cx="128" cy="128" r="64" fill="#ffffff"/>
  <!-- Inner disk filled with background gradient to create a ring -->
  <circle cx="128" cy="128" r="46" fill="url(#grad)"/>
  <!-- Small bar to form the 'G' opening -->
  <rect x="140" y="118" width="40" height="20" rx="6" ry="6" fill="#ffffff" transform="rotate(0 160 128)"/>
</svg>



